[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-host"
version = "0.1.0"
description = "V1 host CLI for STM32 controlled short-circuit pulse platform"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "pyvisa>=1.14.1",
  "pypdf>=4.2.0",
  "pymupdf>=1.24.0",
  "pytesseract>=0.3.13",
  "pillow>=10.4.0",
]

[project.optional-dependencies]
qt = [
  "PySide6>=6.8",
]

[project.scripts]
pulse-host = "pulse_host.cli:main"
pulse-host-gui = "pulse_host.gui:main"
pulse-pdf = "pulse_host.pdf_cli:main"
pulse-host-qt-preview = "pulse_host.qt_preview:main"
pulse-host-qt-designer = "pulse_host.qt_designer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
